---
manifest_version: "6.0.0"
release_target: "6.0.0"

# Two classes, counted separately and never averaged together.
#   class_a — prose quality, scored 0-100
#   class_b — runtime correctness, pass/fail

total_cases: 68
authored_cases: 18
reserved_cases: 50

# class_a
# `category_count`, not `categories` — the v3 manifest declared `categories: 12`
# as a scalar and `categories:` as a list, and YAML silently kept the list. The
# scalar had never been read by anything.
category_count: 12
category_cases: 60
authored_category_cases: 10

# class_b
runtime_case_files: 2
authored_runtime_cases: 8

gates:
  score_improvement:
    pct_cases_must_improve: 70
    min_points: 5
    denominator: authored_category_cases
  regression:
    max_drop_without_reason: 3
  evidence_safety:
    fabrication_trap_recall: 100
  voice_preservation:
    drift_direction_recall: 80
  genre_collision:
    declared_stack_required: true
  narrative_audit:
    detects_dead_props: true
    detects_flat_setting: true
    detects_missing_payoff: true
  output_packaging:
    delivery_bundle_validates: true

# Runtime gates are pass/fail. There is no threshold, no percentage and no
# weighting. `max_failures: 0` is the whole gate. A gate with no authored
# case reports not_evaluated and blocks the release; it never reports passed.
runtime_gates:
  b1_conflict_preservation:
    max_failures: 0
    command: "wi merge <branch> --json"
    asserts:
      - "no value in the output is absent from base, ours and theirs"
      - "clean is false"
      - "merge_commit is null"
      - "both input summaries appear in the conflict record"
    law: Q
    cases: runtime/conflict_preservation
  b2_simulation_fidelity:
    max_failures: 0
    command: "wi simulate --json then wi commit --json"
    asserts:
      - "simulate.candidate_root equals commit.root"
      - "simulate.committed is false"
      - "simulate.base_root is identical across two consecutive runs"
      - "commit.prior_root equals simulate.base_root"
    law: P
    cases: runtime/simulation_fidelity
  b3_impact_precision:
    max_failures: 0
    command: "wi simulate --json"
    asserts:
      - "changed_nodes equals the known changed set exactly"
      - "stale_frontier equals the known stale set exactly"
      - "hard_stale_frontier equals the known invalidated set exactly"
      - "provably_unaffected equals the known unaffected count exactly"
    comparison: set_equality
    law: R
    cases: null
    not_evaluated_because: "no authored case; gate declared, case owed"
  b4_authority:
    max_failures: 0
    command: "wi decide <proposal> --accept --actor <actor>"
    asserts:
      - "live grant is accepted"
      - "expired grant is refused with WI_AUTHORITY_EXPIRED and exit 2"
      - "absent grant is refused with WI_AUTHORITY_DENIED and exit 2"
      - "the two refusals carry different repair guidance"
      - "neither refused transition is applied to state"
    law: O
    cases: null
    not_evaluated_because: "no authored case; gate declared, case owed"
  b5_digest_stability:
    max_failures: 0
    command: "wi canon <file> --json"
    asserts:
      - "key reordering does not move content_digest or state_digest_v6"
      - "reindenting does not move content_digest or state_digest_v6"
      - "NFD input does not move content_digest or state_digest_v6"
      - "a changed value does move both digests"
      - "the same canonical bytes digest differently under different domains"
    directions: both
    law: M
    cases: null
    not_evaluated_because: "no authored case; gate declared, case owed"
  b6_capsule_verification:
    max_failures: 0
    command: "wi capsule verify <path>"
    asserts:
      - "a clean capsule reports VERDICT VERIFIED and exits 0"
      - "a tampered disclosed state fails the named check state.digest"
      - "a tampered leaf_digest fails the named check leaf.digest"
      - "a broken format marker fails the named check capsule.format"
      - "no tampered capsule prints VERDICT VERIFIED"
      - "every tampered capsule exits 2"
    law: L
    cases: null
    not_evaluated_because: "no authored case; gate declared, case owed"

