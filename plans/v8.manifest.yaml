# v8.manifest.yaml — Writing Intelligence v8, Story Intelligence.
#
# The one status source for v8. It does not replace plans/v6.manifest.yaml or
# plans/v7.manifest.yaml; both stay authoritative for their own waves.
#
# v8 was delivered as four independent packages. Each package's own proposal
# remains beside this file, unchanged:
#   plans/v8-fiction.proposal.json                       (FI8-00 .. FI8-06)
#   plans/v8-arc.proposal.json                           (WI8-00 .. WI8-11)
#   extensions/wi8/craft03/plans/v8-craft03.proposal.json (WI8-12 .. WI8-23)
#   extensions/wi8/japan04/plans/japan04_waves.json      (WI8-24 .. WI8-43)
# Their planned waves are carried here verbatim in name and status. FI8-00 to
# FI8-02 read "completed_locally" in the fiction proposal; that is a package
# measurement, and the release-level claim it supports is WI8-R0..R2 below.
#
# Rules enforced by scripts/check-manifest.py:
#   * receipts_required — a wave may be `shipped` only with a PASS receipt
#     carrying the command, the observed result, a negative control and an
#     independent readback
#   * a shipped wave's dependencies must themselves be shipped
#
# Shipped here means the wave's declared exit held on measurement. It never
# means a novel is good, a reader was satisfied, a cultural claim is accurate
# or a book was published. No such claim appears anywhere in this file.

schema: wi.build-manifest/v1
program: writing-intelligence-v8-story-intelligence
program_id: WI8-SI
horizon: 2028-12
core_version: 8.0.0
baseline_sha: d4524f3caa5f75e005b23f94dcd1c71bb5002127
receipts_required: true
# proves.artifacts lists only files the runtime bundle carries, so this manifest
# validates inside the extracted bundle as well as in the repository. The
# receipts name the engines, scripts/test-v8.sh and packs/story/SKILL.md.

waves:
  # ------------------------------------------------------------------------
  # Shipped in 8.0.0 — the four engines, merged, tested and bundled
  # ------------------------------------------------------------------------
  - id: WI8-R0
    name: Additive merge of the four v8 packages
    status: shipped
    depends_on: []
    receipt: plans/receipts/WI8-R0.json
    proves:
      artifacts: [plans/receipts/WI8-R0.json, references/v8/README.md]
    exit:
      - each package installed by its own fail-closed installer with zero collisions
      - no v4 to v7 file is deleted, and none changes behaviour
      - every file in the four packages is present in the tree
      - a second install against the merged tree is refused

  - id: WI8-R1
    name: The four engines run from one tree, with cross-engine twins
    status: shipped
    depends_on: [WI8-R0]
    receipt: plans/receipts/WI8-R1.json
    proves:
      artifacts: [plans/receipts/WI8-R1.json]
    exit:
      - all four package suites pass unchanged inside the repository
      - every publication gate holds with exit 3 and every refusal exits 2
      - the registers carry exactly 340 numbered requirements
      - the v4, v5, v6 and v7 suites pass unchanged
      - breaking a publication gate turns scripts/test-v8.sh red

  - id: WI8-R2
    name: Three bundles, under the ceiling, reproducible
    status: shipped
    depends_on: [WI8-R1]
    receipt: plans/receipts/WI8-R2.json
    proves:
      artifacts: [plans/receipts/WI8-R2.json]
    exit:
      - runtime, craft and story bundles each hold at most 200 files
      - every SKILL.md description is at most 1024 characters with no colon-space
      - scripts/test-v8.sh passes inside the extracted story bundle
      - two builds of one tree produce identical bytes
      - a description over the limit is refused by the build

