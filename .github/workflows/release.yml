name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v4.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build, verify and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve tag
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG"                >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"        >> "$GITHUB_OUTPUT"

      # A release whose verifier is broken is the worst artifact this project
      # could publish: it installs cleanly and quietly certifies nothing.
      - name: Verifier regression must pass
        run: bash tests/v4/test_wi.sh

      - name: Every relative link resolves
        run: python3 scripts/check-links.py

      - name: Build the skill bundle
        run: bash scripts/build-skill.sh --no-root

      - name: Version consistency
        run: |
          WANT="${{ steps.v.outputs.version }}"
          GOT=$(python3 scripts/wi.py --version | awk '{print $2}')
          echo "tag=$WANT  wi.py=$GOT"
          test "$WANT" = "$GOT" \
            || { echo "::error::tag $WANT does not match wi.py $GOT"; exit 1; }
          grep -q "## \[$WANT\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no entry for $WANT"; exit 1; }

      - name: Release notes
        id: notes
        run: |
          F="release/RELEASE_NOTES_${{ steps.v.outputs.tag }}.md"
          if [ -f "$F" ]; then
            echo "file=$F" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::$F not found; generating notes from commits"
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARGS=(
            "${{ steps.v.outputs.tag }}"
            dist/writing-intelligence.skill
            dist/writing-intelligence.skill.sha256
            --title "Writing Intelligence ${{ steps.v.outputs.tag }}"
            --verify-tag
          )
          if [ -n "${{ steps.notes.outputs.file }}" ]; then
            ARGS+=(--notes-file "${{ steps.notes.outputs.file }}")
          else
            ARGS+=(--generate-notes)
          fi

          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "release exists; replacing assets"
            gh release upload "${{ steps.v.outputs.tag }}" \
              dist/writing-intelligence.skill \
              dist/writing-intelligence.skill.sha256 --clobber
          else
            gh release create "${ARGS[@]}"
          fi
